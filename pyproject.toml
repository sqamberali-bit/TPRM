[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrm"
version = "0.1.0"
description = "Vendor Risk Management — tiered risk register for NSW local council"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "python-docx>=1.1,<2",
    "msal>=1.28,<2",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "structlog>=24.1,<25",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
]

[project.scripts]
vrm = "vrm.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["vrm*"]
